
name: Aluminum Ainaki Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Aluminum Ainaki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android \
              --org ma.plaques \
              --project-name plaques_pro_copy .
          fi

      - name: Configure app name and Bluetooth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not found.")

          content = manifest.read_text(encoding="utf-8")

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Aluminum Ainaki"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not update the Android app name.")

          permissions = {
              "android.permission.BLUETOOTH":
                  '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              "android.permission.BLUETOOTH_ADMIN":
                  '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              "android.permission.BLUETOOTH_CONNECT":
                  '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              "android.permission.BLUETOOTH_SCAN":
                  '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              "android.permission.ACCESS_FINE_LOCATION":
                  '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />',
          }

          missing = [
              xml for permission, xml in permissions.items()
              if not re.search(
                  r'android:name="' + re.escape(permission) + r'"',
                  content
              )
          ]

          if missing:
              marker = "<application"
              if marker not in content:
                  raise SystemExit("Could not find application tag.")
              content = content.replace(
                  marker,
                  "\n    " + "\n    ".join(missing) + "\n    " + marker,
                  1,
              )

          manifest.write_text(content, encoding="utf-8")
          print("App name and Bluetooth permissions configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart code
        run: |
          dart format lib
          if [ -d test ]; then
            dart format test
          fi

    
      - name: Run tests
        run: |
          # Remove Flutter's outdated starter widget test.
          rm -f test/widget_test.dart

          # Run the remaining project tests.
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No test files found. Skipping tests."
          fi

      - name: Analyze Dart code
  run: |
    dart fix --apply
    dart format lib test
    flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aluminum-Ainaki-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
