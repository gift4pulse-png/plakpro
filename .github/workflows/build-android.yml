
name: Aluminum Ainaki Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Aluminum Ainaki
    runs-on: ubuntu-latest

    steps:
      # 1. Download project source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Generate Android folder if missing
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android \
              --org ma.plaques \
              --project-name plaques_pro_copy .
          fi

      # 5. Configure app name and Bluetooth permissions
      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not found.")

          content = manifest.read_text(encoding="utf-8")

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Aluminum Ainaki"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not configure app name.")

          permissions = {
              "android.permission.BLUETOOTH":
                  '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              "android.permission.BLUETOOTH_ADMIN":
                  '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              "android.permission.BLUETOOTH_CONNECT":
                  '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              "android.permission.BLUETOOTH_SCAN":
                  '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              "android.permission.ACCESS_FINE_LOCATION":
                  '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />',
          }

          missing = [
              xml for permission, xml in permissions.items()
              if not re.search(
                  r'android:name="' + re.escape(permission) + r'"',
                  content
              )
          ]

          if missing:
              marker = "<application"

              if marker not in content:
                  raise SystemExit("Could not find application tag.")

              content = content.replace(
                  marker,
                  "\n    " + "\n    ".join(missing) + "\n    " + marker,
                  1,
              )

          manifest.write_text(content, encoding="utf-8")

          print("Aluminum Ainaki Android configuration completed.")
          PY

      # 6. Install Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Remove outdated Flutter starter test
      - name: Remove outdated starter test
        run: rm -f test/widget_test.dart

      # 8. Format Dart files
      - name: Format Dart code
        run: |
          dart format lib

          if [ -d test ]; then
            dart format test
          fi

      # 9. Run project tests
      - name: Run tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No test files found. Skipping tests."
          fi

      # 10. Analyze Dart code
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      # 11. Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aluminum-Ainaki-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
