
name: Plaques Pro Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ma.plaques --project-name AluminumAinaki .
          fi

             sed -i 's/android:label="[^"]*"/android:label="Aluminum Ainaki"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Plaques-Pro-Copy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
